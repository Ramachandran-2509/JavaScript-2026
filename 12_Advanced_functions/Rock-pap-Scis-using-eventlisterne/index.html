<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Document</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <p class="title">Rock paper Scissors</p>
  <button  aria-label="Rock" class="move-button js-rock">
    <img class="move-icon" src="./rock-emoji.png" alt="Rock" />

  </button>
  <button  aria-label="Paper" class="move-button js-paper">
    <img class="move-icon" src="./paper-emoji.png" alt="Paper" /></button>

  <button  aria-label="Scissors" class="move-button js-scissors">
    <img class="move-icon" src="./scissors-emoji.png" alt="Scissors" /></button>

  <p class="js-result"></p>

  <p class="js-moves"></p>

  <p class="js-score"></p>

  <!-- <p class="rest"></p> -->

  <button onclick="resetGame()" class='js-reset' >Reset Value</button>
  <button onclick="autoPlay()" class="js-autopaly">Auto Play</button>

    <script src="index.js"></script>
  </body>
</html>
